<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="mfx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- M + F mark -->
  <rect x="4" y="4" width="52" height="52" rx="12" fill="url(#mfx)" opacity="0.15"/>
  <text x="8" y="43" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="36" fill="url(#mfx)">M</text>
  <text x="34" y="43" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="36" fill="url(#mfx)">F</text>
  <!-- Master FX wordmark -->
  <text x="66" y="30" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="#ffffff" letter-spacing="1">Master</text>
  <text x="66" y="50" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" fill="url(#mfx)" letter-spacing="2">FX</text>
</svg>
